[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mirogate-boundary"
version = "0.1.0"
description = "Local-first text egress guardrails and Arabic privacy evaluation for AI applications"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Mirogate"}]
keywords = ["privacy", "pii", "arabic", "llm", "security", "local-first"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.urls]
Homepage = "https://github.com/mirogate/mirogate-boundary"
Issues = "https://github.com/mirogate/mirogate-boundary/issues"

[project.scripts]
boundary = "mirogate_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
