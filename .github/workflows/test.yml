name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: python -m mirogate_boundary scan --detector rules --file examples/contact.txt
      - run: python -m mirogate_boundary bench --detector rules --dataset benchmarks/arabic-privacy-v0.1.jsonl --output build/benchmark.json
      - run: python -m build
